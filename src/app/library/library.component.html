<app-navbar (click)="cancelSelected($event)"></app-navbar>

<div *ngIf="showSnackbar">
    <app-snackbar [message]="snackbarMessage"></app-snackbar>
</div>

<div class="container-fluid bg-lightest pb-4" style="min-height: 100%;" *ngIf="!selected">
    <div class="row">
        <div class="col-12">
            <div class="header w-100 text-center">
                <div class="create-profile-wrapper" *ngIf="!mobile">
                    <a [routerLink]="['/create']"><button class="btn btn-outline-primary inc-font bg-white py-2 px-4">
                        <span>Create Senior Profile</span> 
                    </button></a>
                </div>
                <h1 class="mt-4 display-4 library-title">Class of 2020</h1>
                <h3 class="mb-4 f1"> &mdash; Senior Library &mdash; </h3>
            </div>

            <div class="my-3" [ngClass]="(mobile==false)?'mx-4':'mx-2'">
                <div class="create-profile-wrapper w-100 text-center" *ngIf="mobile">
                    <a [routerLink]="['/create']">
                        <button class="btn btn-primary inc-font py-2 px-4">
                            <span>Create Senior Profile &nbsp;<i class="fa fa-arrow-circle-right"></i></span>
                        </button>
                    </a>
                </div>
    
                <!--Search Seniors-->
                <form [formGroup]="searchForm" class="mt-3">
                    <div class="form-group">
                        <input type="search" required class="form-control primary-border px-3 search-input" id="search" name="search" placeholder="Search" 
                        formControlName="search" (input)="onSearch()" maxlength="100">
                    </div>
                </form>
            </div>

            <div *ngIf="seniors" class="row equal" [ngClass]="(mobile==false)?'mx-2':'mx-0'">
                <div *ngFor="let senior of seniors" class="col-12 col-sm-6 col-md-4 col-lg-3 mb-3">
                    <div class="bg-white border border-light-gray rounded py-3 h-100 w-100 text-center mx-auto d-flex overflow-hidden" (click)="getProfile(senior)">
                        <div class="align-self-center justify-content-center w-100">
                            <div *ngIf="senior.url" class="w-100 text-center">
                                <img src="{{senior.url}}" class="profile-pic rounded">
                            </div>
                            <div class="w-100 text-center mt-2 px-3 f4 inc-font">
                                {{ senior.fname }} {{ senior.lname }}
                            </div>
                            <div class="w-100 text-center mb-2 px-3 f3 text-secondary">
                                {{ senior.school }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div *ngIf="!seniors && !noResults" class="row text-center mt-5 justify-content-center">
                <div class="spinner-border text-primary text-center" role="status">
                  <span class="sr-only">Loading...</span>
                </div>
            </div>

            <div *ngIf="noResults" class="text-left mt-2 ml-3">
                <div class="ml-4 inc-font text-gray f4">
                  {{ message }}
                </div>
            </div>
        </div>
    </div>
</div>  

<div *ngIf="selected" style="min-height: calc(100%-75px);">
    <button class="btn btn-secondary back-btn inc-font py-2 px-3"
     (click)="cancel()"><i class="fa fa-arrow-circle-left"></i></button>
    <app-profile [senior]="selected"></app-profile>
</div>

<div *ngIf="!selected" class="border-top border-lighter">
    <app-footer></app-footer>
</div>
