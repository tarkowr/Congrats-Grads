<app-navbar></app-navbar>

<div class="page-margin-top page-min-height wrapper">
    <div id="background" class="text-center w-100">
        <div class="w-100 row m-0" [ngClass]="mobile ? 'pt-4':'pt-5'">
            <div id="profile" class="col-10 offset-1 col-lg-8 offset-lg-2 bg-white mb-5">
                <div class="row px-3 content-container overflow-hidden" [ngClass]="mobile ? 'py-4':'py-5'">
                    <div *ngIf="!senior" class="w-100 text-center my-5 py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="sr-only">Loading...</span>
                        </div>
                    </div>
                    <div *ngIf="senior">
                        <div *ngIf="senior.url" class=" col-12 col-md-6 overflow-hidden d-flex text-center w-100">
                            <img src="{{senior.url}}" class="rounded profile-pic align-self-center mx-auto justify-content-center">
                        </div>
                        <div class="col-12 col-md-6 text-left overflow-hidden px-0" [ngClass]="mobile ? 'pt-2':'pt-0'">
                            <h6 class="py-0 mb-2 jost f4" [ngClass]="mobile ? 'text-center':'text-left'"><strong>── CLASS OF {{ senior.year }} ──</strong></h6>
                            <h2 class="text-left jost text-dark my-0 f6" [ngClass]="{'display-5': !mobile}">{{ senior.fname | uppercase }}</h2>
                            <h2 class="text-left jost text-dark my-0 f6" [ngClass]="{'display-5': !mobile}">{{ senior.lname | uppercase }}</h2>
                            <div class="mb-0 mt-2 oswald inc-font f6 text-gray">{{ senior.school | uppercase }}</div>
                            <div class="mt-2">{{ senior.comments }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
