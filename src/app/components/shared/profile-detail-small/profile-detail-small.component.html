<!--Profile Detail-->
<div *ngIf="senior" class="row">

    <!--Profile Picture-->
    <div class="col-12 overflow-hidden text-center">
        <div class="profile-pic-wrapper mx-auto rounded">
            <img src="{{senior.url || '../../../../assets/images/placeholder.png'}}" class="profile-pic">
        </div>
    </div>

    <!--Profile Data-->
    <div class="col-12 overflow-hidden px-0 text-center">
        <div class="h6 mt-3 mb-2 jost f4">
            <strong>── CLASS OF {{ senior.year }} ──</strong>
        </div>
        <h2 class="jost text-dark my-0 f6">{{ senior.fname | uppercase }}</h2>
        <h2 class="jost text-dark my-0 f6">{{ senior.lname | uppercase }}</h2>
        <div class="mb-0 mt-2 oswald inc-font f6 text-gray">{{ senior.school | uppercase }}</div>
        <div class="mt-2 f3 text-left">{{ senior.comments }}</div>
    </div>
</div>
