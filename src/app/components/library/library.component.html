<app-navbar></app-navbar>

<div class="page-min-height page-margin-top container-fluid bg-lightest pb-4">
    <div class="row">
        <div class="col-12">
            <div class="header w-100 text-center">
                <div class="create-profile-wrapper" *ngIf="!mobile">
                    <a [routerLink]="['/create']"><button class="btn btn-outline-primary inc-font bg-white py-2 px-4">
                        <span>Create Senior Profile</span> 
                    </button></a>
                </div>
                <div class="mt-4 display-4 library-title">Class of {{ library.year.value }}</div>
                <div class="mt-2 mb-4 h3 f1"> &mdash; Senior Library &mdash; </div>
            </div>

            <div class="mt-4 mb-3" [ngClass]="{'mx-4': !mobile}">
                <div class="row">
                    <!--Search-->
                    <form [formGroup]="searchForm" class="col-12 col-md-6">
                        <div class="form-group mb-2">
                            <input type="search" required class="form-control primary-border px-3 search-input" id="search" name="search" placeholder="Search" 
                            formControlName="search" (input)="pof()" maxlength="100">
                        </div>
                    </form>

                    <!--Order By-->
                    <form [formGroup]="orderForm" class="col-12 col-md-6">
                        <div class="form-group select-form-group mb-0">
                            <select required class="form-control primary-border bg-white px-3 order-select mx-1" id="order" name="order" 
                            formControlName="order" (change)="pof()">
                                <option *ngFor="let opt of orderOptions" [value]="opt.key">{{ opt.value }}</option>
                            </select>
                        </div>

                        <div class="form-group select-form-group mb-0">
                            <select required class="form-control primary-border bg-white px-3 year-select mx-1" id="year" name="year" 
                            formControlName="year" (change)="changeYear()">
                                <option *ngFor="let opt of yearOptions" [value]="opt.key">{{ opt.value }}</option>
                            </select>
                        </div>
                    </form>
                </div>
            </div>

            <div *ngIf="seniors" class="row equal pt-1" [ngClass]="{'mx-2': !mobile}">
                <div *ngFor="let senior of seniors" class="col-12 col-sm-6 col-md-4 col-lg-3 mb-3">
                    <div class="bg-white border border-light-gray py-3 h-100 w-100 text-center mx-auto d-flex overflow-hidden senior-card"
                     (click)="getProfile(senior)" id="{{senior.id}}">
                        <div class="align-self-center justify-content-center w-100">
                            <div *ngIf="senior.url" class="w-100 text-center">
                                <div class="picture-wrapper rounded">
                                    <img src="{{senior.url}}" class="profile-pic">
                                </div>
                            </div>
                            <div class="w-100 text-center mt-2 px-3 f4 inc-font">
                                {{ senior.fname }} {{ senior.lname }}
                            </div>
                            <div class="w-100 text-center mb-2 px-3 text-secondary">
                                {{ senior.school }}
                            </div>
                        </div>
                    </div>
                </div>

                <div *ngIf="!noSearchResults" class="my-3 text-center mx-auto col-12">
                    <div class="inc-font rounded-circle border bg-white page-btn d-inline-block text-center" (click)="pageLeft()">
                        <i class="fa fa-angle-left page-btn-left"></i>
                    </div>
                    <div class="d-inline-block mx-2 not-selectable">{{ getPageState() }}</div>
                    <div class="inc-font rounded-circle border bg-white page-btn d-inline-block text-center" (click)="pageRight()">
                        <i class="fa fa-angle-right page-btn-right"></i>
                    </div>
                </div>
            </div>

            <div *ngIf="!seniors && !noSearchResults" class="row text-center mt-5 justify-content-center">
                <div class="spinner-border text-primary text-center" role="status">
                  <span class="sr-only">Loading...</span>
                </div>
            </div>

            <div *ngIf="noSearchResults" class="text-center my-3">
                <div class="inc-font text-gray">
                    No Results!
                </div>
                <div>
                    <button class="btn btn-primary my-3 px-4 py-2" (click)="clearSearch()">
                        Clear Search
                    </button>
                </div>
            </div>

            <div class="text-center mt-2">
                Experiencing an issue? <a [routerLink]="['/contact']" class="text-primary">Let us know!</a>
            </div>
        </div>
    </div>
</div>  

<app-footer></app-footer>
