<app-navbar></app-navbar>

<!--Desktop back button-->
<a *ngIf="showBackButton" [routerLink]="['/library']">
    <button class="btn btn-secondary back-btn inc-font py-2 px-3">
        <i class="fa fa-arrow-circle-left"></i>
    </button>
</a>

<div class="page-margin-top">
    <div [ngClass]="{'background-gradient': !mobile}" class="text-center w-100 page-min-height">
        <div class="w-100 row m-0" [ngClass]="{'pt-5': !mobile}">
            <div [ngClass]="{'profile-card mb-5': !mobile}" class="col-12 col-md-10 offset-md-1 col-lg-8 offset-lg-2 bg-white mb-3">
                <div class="px-3 overflow-hidden" [ngClass]="mobile ? 'py-4':'py-5'">

                    <!--Error-->
                    <div *ngIf="error" class="my-5">
                        <div class="h5">
                            We can't find that profile!
                        </div>
                        <div class="mt-4">
                            <a routerLink="/"><button class="btn btn-primary px-4 py-2">Return Home</button></a>
                        </div>
                        <div class="mt-2">
                            <a routerLink="/library" class="text-primary mt-2 f4">View Library</a>
                        </div> 
                    </div>

                    <div *ngIf="!error">

                        <!--Loading-->
                        <div *ngIf="!senior" class="w-100 text-center my-5 py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="sr-only">Loading...</span>
                            </div>
                        </div>

                        <!--Success-->
                        <div *ngIf="senior">
                            <div *ngIf="mobile">
                                <app-profile-detail-small [senior]="senior"></app-profile-detail-small>
                            </div>

                            <div *ngIf="!mobile">
                                <app-profile-detail [senior]="senior"></app-profile-detail>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
