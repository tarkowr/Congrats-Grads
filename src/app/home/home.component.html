<div class="container-fluid bg-lightest">
    <div class="row">

        <!--Landing Picture-->
        <div *ngIf="!mobile" class="col col-0 col-lg-5 col-xl-4 col-override p-0" style="min-height: 100vh;">
            <div class="landing-pic d-none d-lg-block d-xl-block border-right border-light-gray"></div> 
        </div>
        <div *ngIf="mobile" class="col col-12 col-override p-0">
            <div class="landing-pic-mini">
                <div class="w-100 h-100 shadow-effect text-center align-items-center">
                    <div class="text-white landing-image-text">
                        <h1 class="display-4 f1"><span id="mobile-typed"></span></h1>
                    </div>
                </div>
            </div>
        </div>

        <div class="col col-12 col-lg-7 col-xl-8 justify-content-center text-center">

            <!--Desktop Upper CTA-->
            <div *ngIf="!mobile" class="mr-2 mt-3 justify-content-right text-right">
                <a [routerLink]="['/library']">
                    <button class="btn btn-outline-primary inc-font library-btn px-3" (click)="cancel()">
                        View Senior Library
                    </button>
                </a>
            </div>

            <div class="landing-text">

                <!--Desktop Promo-->
                <div *ngIf="!mobile">
                    <img class="logo" src="../../assets/logos/icon.png">
                    <h1 class="display-4 mt-4 f1"><span id="typed"></span></h1>
                    <h2 class="mt-3 text-primary f1 congratsgrads"><em>#congratsgrads</em></h2>
                </div>

                <!--Call to Action-->
                <div [ngClass]="mobile ? 'mt-3':'mt-5'" class="pt-3">
                    <a [routerLink]="['/create']">
                        <button class="btn btn-primary inc-font py-2 px-4" (click)="cancel()">
                            <span>Create Senior Profile</span>
                        </button>
                    </a>
                    <div class="inc-font f3 mt-3">
                        <span *ngIf="!mobile">Already Uploaded? &nbsp; <br class="conditional-br"></span> <a (click)="cancel()" [routerLink]="['/library']" class="text-primary">View Library</a>
                    </div>
                    <div class="text-center mt-4">
                        <h1>
                            <a target="_blank" href="https://www.instagram.com/congratsgrads2020/">
                                <i class="fa fa-instagram text-gray social"></i>
                            </a> &nbsp;
                            <a target="_blank" href="https://www.facebook.com/congratsGrads2020/">
                                <i class="fa fa-facebook-square text-gray social"></i>
                            </a>
                        </h1>
                    </div>
                </div>
            </div>

            <div class="row mt-4 landing-footer border-top border-lighter bg-white">
                <div class="col-12">
                    <app-footer></app-footer>
                </div>
            </div>
        </div>
    </div>
</div>
