<div class="container-fluid">
    <div class="row">
        <div *ngIf="!mobile" class="col col-0 col-lg-5 col-xl-4 col-override p-0" style="min-height: 100vh;">
            <div class="landing-pic d-none d-lg-block d-xl-block border-right border-light-gray"></div> 
        </div>
        <div *ngIf="mobile" class="col col-12 col-override p-0">
            <div class="landing-pic-mini">
                <div class="w-100 h-100 shadow-effect text-center align-items-center">
                    <div class="text-white landing-image-text">
                        <h1 class="display-4 f1"><span id="mobile-typed"></span></h1>
                    </div>
                </div>
            </div>
        </div>

        <div class="col col-12 col-lg-7 col-xl-8 justify-content-center text-center">
            <div *ngIf="!mobile" class="mr-2 mt-3 justify-content-right text-right">
                <a [routerLink]="['/']">
                    <button class="btn btn-outline-primary inc-font library-btn px-3">
                        View Senior Library
                    </button>
                </a>
            </div>

            <div class="landing-text">
                <div *ngIf="!mobile">
                    <img class="logo" src="../../assets/logos/icon.png">
                    <h1 class="display-4 mt-4 f1"><span id="typed"></span></h1>
                    <h2 class="mt-3 text-primary f1 congratsgrads"><em>#congratsgrads</em></h2>
                </div>

                <div *ngIf="mobile">
                    <h4 class="text-dark f1"><em>#congratsgrads</em></h4>
                </div>

                <div [ngClass]="(mobile==false)?'mt-5':'mt-3'" class="pt-3">
                    <a [routerLink]="['/']">
                        <button class="btn btn-primary inc-font py-2 px-4">
                            <span>Create Senior Profile</span>
                        </button>
                    </a>
                    <div class="inc-font f3" [ngClass]="(mobile==false)?'mt-4':'mt-3'">
                        <span *ngIf="!mobile">Already Uploaded? &nbsp; <br class="conditional-br"></span> <a [routerLink]="['/']" class="text-primary">View Library</a>
                    </div>
                </div>
            </div>

            <div [ngClass]="(mobile==false)?'fixed-bottom':'mt-4'" class="text-center row landing-footer border-top border-lighter">
                <div class="col-12 col-lg-7 offset-lg-5 col-xl-8 offset-xl-4 bg-white py-3">
                    CongratsGrads 2020 &nbsp; <span class="conditional-ln">|</span> <br class="conditional-br"> &nbsp; Created by <a href="https://richietarkowski.com" target="_blank" class="text-primary">Richie Tarkowski</a>
                </div>
            </div>
        </div>
    </div>
</div>
